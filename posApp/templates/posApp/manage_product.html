<div class="container-fluid">
    <form action="" id="product-form" enctype="multipart/form-data" method="post">
        {% csrf_token %}
        <input type="hidden" name="id" value="{% if product.pk %}{{product.pk}}{% endif %}">
        
        <div class="row">
            <div class="col-md-6">
                <div class="form-group mb-4">
                    <label for="code" class="control-label mb-2" style="font-weight: 600; color: #2c3e50; font-size: 15px;">
                        <i class="mdi mdi-barcode me-2"></i>Product Code
                    </label>
                    <input type="text" name="code" id="code" class="form-control form-control-lg" value="{% if product.code %}{{product.code}}{% endif %}" required placeholder="Enter product code" style="border-radius: 10px; border: 2px solid #e9ecef; padding: 12px;">
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="form-group mb-4">
                    <label for="category_id" class="control-label mb-2" style="font-weight: 600; color: #2c3e50; font-size: 15px;">
                        <i class="mdi mdi-format-list-bulleted me-2"></i>Category
                    </label>
                    <select name="category_id" id="category_id" class="form-select form-select-lg" required style="border-radius: 10px; border: 2px solid #e9ecef; padding: 12px;">
                        {% if not product.category_id %}
                        <option value="" disabled selected>Select Category</option>
                        {% else %}
                        <option value="" disabled>Select Category</option>
                        {% endif %}
                        {% for category in categories %}
                            {% if product.category_id == category.id %}
                            <option value="{{ category.id }}" selected>{{ category.name }}</option>
                            {% else %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
        
        <div class="form-group mb-4">
            <label for="name" class="control-label mb-2" style="font-weight: 600; color: #2c3e50; font-size: 15px;">
                <i class="mdi mdi-package-variant me-2"></i>Product Name
            </label>
            <input type="text" name="name" id="name" class="form-control form-control-lg" value="{% if product.name %}{{product.name}}{% endif %}" required placeholder="Enter product name" style="border-radius: 10px; border: 2px solid #e9ecef; padding: 12px;">
        </div>
        
        <div class="form-group mb-4">
            <label for="description" class="control-label mb-2" style="font-weight: 600; color: #2c3e50; font-size: 15px;">
                <i class="mdi mdi-text me-2"></i>Description
            </label>
            <textarea rows="4" name="description" id="description" class="form-control" required placeholder="Enter product description" style="border-radius: 10px; border: 2px solid #e9ecef; padding: 12px;">{% if product.description %}{{product.description}}{% endif %}</textarea>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="form-group mb-4">
                    <label for="price" class="control-label mb-2" style="font-weight: 600; color: #2c3e50; font-size: 15px;">
                        <i class="mdi mdi-currency-usd me-2"></i>Price
                    </label>
                    <input type="text" name="price" id="price" class="form-control form-control-lg" value="{% if product.price %}{{product.price}}{% endif %}" required placeholder="0.00" style="border-radius: 10px; border: 2px solid #e9ecef; padding: 12px;">
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="form-group mb-4">
                    <label for="status" class="control-label mb-2" style="font-weight: 600; color: #2c3e50; font-size: 15px;">
                        <i class="mdi mdi-check-circle me-2"></i>Status
                    </label>
                    <select name="status" id="status" class="form-select form-select-lg" required style="border-radius: 10px; border: 2px solid #e9ecef; padding: 12px;">
                        {% if product.status and product.status == 1 %}
                        <option value="1" selected>Active</option>
                        {% else %}
                        <option value="1">Active</option>
                        {% endif %}

                        {% if product.status and product.status == 0 %}
                        <option value="0" selected>Inactive</option>
                        {% else %}
                        <option value="0">Inactive</option>
                        {% endif %}
                    </select>
                </div>
            </div>
        </div>
        
        <div class="form-group mb-4">
            <label for="image" class="control-label mb-2" style="font-weight: 600; color: #2c3e50; font-size: 15px;">
                <i class="mdi mdi-image me-2"></i>Product Image
            </label>
            <input type="file" name="image" id="image" class="form-control form-control-lg" accept="image/*" required style="border-radius: 10px; border: 2px solid #e9ecef; padding: 12px;">
            <small class="text-muted mt-2 d-block">Supported formats: JPG, PNG, GIF</small>
        </div>
    </form>
</div>

<script>
    $(function() {
        $('#product-form').submit(function(e) {
            e.preventDefault();
            var _this = $(this)
            $('.err-msg').remove();
            var el = $('<div>')
            el.addClass("alert alert-danger err-msg")
            el.hide()
            if (_this[0].checkValidity() == false) {
                _this[0].reportValidity();
                return false;
            }
            start_loader();
            $.ajax({
                headers: {
                    "X-CSRFToken": '{{csrf_token}}'
                },
                url: "{% url 'save-product-page' %}",
                data: new FormData($(this)[0]),
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                type: 'POST',
                dataType: 'json',
                error: err => {
                    console.log(err)
                    end_loader();
                },
                success: function(resp) {
                    if (typeof resp == 'object' && resp.status == 'success') {
                        el.removeClass("alert alert-danger err-msg")
                        location.reload()
                    } else if (resp.status == 'failed' && !!resp.msg) {
                        el.text(resp.msg)
                    } else {
                        el.text("An error occured", 'error');
                        end_loader();
                        console.err(resp)
                    }
                    _this.prepend(el)
                    el.show('slow')
                    $("html, body, .modal").scrollTop(0);
                    end_loader()
                }
            })
        })
    })
</script>
