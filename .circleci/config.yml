version: 2.1

orbs:
  aws-cli: circleci/aws-cli@3.1.5

jobs:

  # ==========================================================
  # 1. PREBUILD JOB (Python, Dependencies, OS packages, Java)
  # ==========================================================
  prebuild:
    docker:
      - image: cimg/python:3.11

    steps:
      - checkout

      - run:
          name: Upgrade pip + Install Python dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - run:
          name: Install OS dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y jq unzip wget

      - run:
          name: Install Java 17 (Amazon Corretto)
          command: |
            sudo apt-get purge -y openjdk*
            sudo apt-get install -y java-common
            wget https://corretto.aws/downloads/latest/amazon-corretto-17-x64-linux-jdk.deb
            sudo dpkg -i amazon-corretto-17-x64-linux-jdk.deb
            java --version

  # ==========================================================
  # 2. BUILD + TEST JOB (Linting, Tests, Sonar, ZIP build)
  # ==========================================================
  build_and_test:
    docker:
      - image: cimg/python:3.11

    steps:
      - checkout

      - run:
          name: Install Python Dependencies
          command: |
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install pylint

      - run:
          name: Collect Static Files
          command: |
            python manage.py collectstatic --noinput

      - run:
          name: Run Pylint
          command: |
            pylint spend_wise || true

      - run:
          name: Run Django Tests
          command: |
            python manage.py test home.tests.LoginTest

      - run:
          name: Install Sonar Scanner
          command: |
            wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
            unzip sonar-scanner-cli-5.0.1.3006-linux.zip
            mv sonar-scanner-5.0.1.3006-linux sonar-scanner

      - run:
          name: Run Sonar Scan
          command: |
            sonar-scanner/bin/sonar-scanner \
              -Dsonar.login=$SONAR_TOKEN \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.projectKey=$SONAR_PROJECT_KEY \
              -Dsonar.organization=$SONAR_ORG \
              -Dsonar.coverage.exclusions=**/* || true

            sleep 5
            curl "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY" > sonar_result.json
            cat sonar_result.json

      - run:
          name: Create deployment ZIP
          command: |
            zip -r deploy.zip . -x "*.git*"

      - persist_to_workspace:
          root: .
          paths:
            - deploy.zip

  # ==========================================================
  # 3. DEPLOY JOB (Elastic Beanstalk)
  # ==========================================================
  deploy:
    docker:
      - image: cimg/python:3.11
  
    environment:
      AWS_REGION: us-east-1
  
    steps:
      - checkout
  
      # Set AWS CLI credentials (no session token allowed here)
      - aws-cli/setup:
          aws-access-key-id: AWS_ACCESS_KEY_ID
          aws-secret-access-key: AWS_SECRET_ACCESS_KEY
          aws-region: AWS_REGION
  
      # Manually load session token
      - run:
          name: Load AWS session token
          command: |
            echo "export AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> $BASH_ENV
            source $BASH_ENV
  
      - run:
          name: Deploy to Elastic Beanstalk
          command: |
            pip install awsebcli
            eb init "Devops-x23300841-eb" --platform python-3.11 --region "$AWS_REGION"
            eb deploy Devops-x23300841-eb-env



# ============================================================
# PIPELINE WORKFLOW
# ============================================================
workflows:
  version: 2
  ci_pipeline:
    jobs:
      - prebuild
      - build_and_test:
          requires:
            - prebuild
      - deploy:
          requires:
            - build_and_test
