version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout

      - run:
          name: Install deps
          command: |
            pip install --upgrade pip
            pip install -r requirements.txt

      - run:
          name: Run Tests
          command: |
            python manage.py test

workflows:
  version: 2
  pipeline:
    jobs:
      - build

